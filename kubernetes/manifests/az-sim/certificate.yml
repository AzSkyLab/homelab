---
# Wildcard cert for the simulated az.home.lab plane, issued by the internal CA.
# Plays the role of the internal-PKI *.az.comp.app cert from the blueprint.
# Ansible (az-ingress-sim.yml) extracts this Secret and installs it on the
# HAProxy/nginx ingress VMs — simulating the Key Vault -> F5 PFX handoff.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: az-wildcard
  namespace: az-sim
spec:
  secretName: az-wildcard-tls
  issuerRef:
    name: home-lab-ca
    kind: ClusterIssuer
  commonName: "*.az.home.lab"
  dnsNames:
    - "*.az.home.lab"
    - "az.home.lab"
  duration: 8760h # 1 year — sim of the 2-3yr internal cert
  privateKey:
    algorithm: RSA
    size: 2048
