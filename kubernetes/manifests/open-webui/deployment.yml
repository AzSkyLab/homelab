---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.3
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Every model comes through LiteLLM; a direct Ollama connection only listed the VM's models a second time
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: OPENAI_API_BASE_URLS
              value: http://litellm.litellm.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: litellm-api-key
                  key: api-key
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
