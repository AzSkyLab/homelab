---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.3
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Every model comes through LiteLLM; a direct Ollama connection only listed the VM's models a second time
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: OPENAI_API_BASE_URLS
              value: http://litellm.litellm.svc.cluster.local:4000/v1
            - name: OPENAI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: litellm-api-key
                  key: api-key
            # Only seed a fresh install: webui.db already has these keys and wins (see CLAUDE.md, Open WebUI Integration)
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: searxng
            - name: SEARXNG_QUERY_URL
              value: http://searxng.searxng.svc.cluster.local:8080/search?q=<query>
            - name: WEB_SEARCH_RESULT_COUNT
              value: "5"
            - name: WEB_SEARCH_CONCURRENT_REQUESTS
              value: "5"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
