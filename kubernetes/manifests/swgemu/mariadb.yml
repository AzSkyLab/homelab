---
# MariaDB for Core3 (accounts, characters list, galaxy table). Core3 needs MySQL, so it can't use postgres-01.
# 10.11 matches the MariaDB that upstream builds and tests against (Debian bookworm).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: swgemu
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: swgemu
  labels:
    app: mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11.19
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: swgemu
            - name: MARIADB_USER
              value: swgemu
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swgemu-secrets
                  key: db-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: swgemu-secrets
                  key: db-root-password
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: swgemu
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
