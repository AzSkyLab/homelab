---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings:
      engines:
        keep_only:
          - google
          - bing
          - duckduckgo
          - brave
          - wikipedia
          - startpage
    general:
      instance_name: Homelab Search
    search:
      safe_search: 0
      formats:
        - html
        - json
    server:
      # secret_key comes from SEARXNG_SECRET (Secret searxng-secrets)
      base_url: https://searxng.home.lab/
      limiter: false
      public_instance: false
      image_proxy: false
    # Open WebUI sends safesearch=1 on every query, which would beat safe_search above
    preferences:
      lock:
        - safesearch
    valkey:
      url: false
    # The defaults leave these off
    engines:
      - name: google
        disabled: false
      - name: bing
        disabled: false
      - name: startpage
        inactive: false
        disabled: false
