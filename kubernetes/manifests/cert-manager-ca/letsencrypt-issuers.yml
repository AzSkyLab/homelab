---
# Publicly trusted certificates for the game's public door (HTTP-01 through the public Traefik, TCP 80).
# No ACME email on purpose: cert-manager renews on its own; add `email:` here to get expiry notices.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik-public
            # The public Traefik redirects port 80 to https for everything, so the challenge must also be served on
            # websecure (Let's Encrypt follows the redirect and does not check the certificate behind it).
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
                  traefik.ingress.kubernetes.io/router.tls: "true"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik-public
            # The public Traefik redirects port 80 to https for everything, so the challenge must also be served on
            # websecure (Let's Encrypt follows the redirect and does not check the certificate behind it).
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
                  traefik.ingress.kubernetes.io/router.tls: "true"
