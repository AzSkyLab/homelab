---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: redis
    targetRevision: "20.13.4"
    helm:
      valuesObject:
        image:
          # Bitnami publishes only :latest now (no version tags), so pin the running build (Redis 8.10.1) by digest
          tag: latest
          digest: sha256:a97a9e3e409d77fe8566d049a337eff53ef2941eb9e40f105dd4ad6ca3417810
        architecture: standalone
        auth:
          enabled: false
        master:
          persistence:
            enabled: true
            size: 2Gi
            storageClass: local-path
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        replica:
          replicaCount: 0
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
