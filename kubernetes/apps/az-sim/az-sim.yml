---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: az-sim
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: applications
  source:
    repoURL: https://github.com/azskylab/homelab.git
    targetRevision: main
    path: kubernetes/manifests/az-sim
  destination:
    server: https://kubernetes.default.svc
    namespace: az-sim
  syncPolicy:
    automated:
      prune: true
      # selfHeal deliberately OFF: game days + blue/green weighting work by
      # kubectl-scaling the color deployments (sim of ACA revision weights);
      # self-heal would instantly revert them (found the hard way in GD-1).
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
