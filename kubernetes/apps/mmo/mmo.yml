---
# The MMO game server. ArgoCD syncs deploy/k8s from the game repo (secrets are made by hand, see its docs/DEPLOY.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mmo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: applications
  source:
    repoURL: git@github.com:AzSkyLab/videogame.git
    targetRevision: main
    path: deploy/k8s
    directory:
      include: "{namespace,deployment,ingress,backup,downloads,metrics,admin-ingress}.yml" # admin-ingress: the admin portal on the internal Traefik (mmo-admin.home.lab, lab and WireGuard only); downloads: game installer and auto-update mirror (needs Secret mmo-downloads-token); metrics: ServiceMonitor so Prometheus scrapes the game
  destination:
    server: https://kubernetes.default.svc
    namespace: mmo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
