---
# ArgoCD
argocd_namespace: argocd
# Chart 10.11.7 ships v3.5.7 (the newest 3.5). 3.6 waits for a few patches: it forces Server-Side Diff on every
# ServerSideApply app (metallb, kube-prometheus-stack, system-upgrade). Chart 10 adds NetworkPolicies by default.
# renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
argocd_chart_version: "10.11.7"
# renovate: datasource=github-releases depName=argoproj/argo-cd
argocd_image_tag: "v3.5.7"
argocd_chart_repo: https://argoproj.github.io/argo-helm
argocd_nodeport: 30443

# Git repo for ArgoCD
argocd_repo_url: https://github.com/azskylab/homelab.git
argocd_repo_branch: main

# Kubeconfig
kubeconfig_path: "{{ playbook_dir }}/../kubeconfig"
